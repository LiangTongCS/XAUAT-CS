#驼峰命名映射，Mysql数据库字段名采用下划线命名，mybatis默认是驼峰命名
#两边名字不一样时，无法返回想要的数据（返回null）
#开启驼峰命名映射后，mybatis会自动将数据库字段名映射为驼峰命名的属性名
mybatis.configuration.map-underscore-to-camel-case=true

